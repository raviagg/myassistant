server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS resolver so upstream is resolved lazily at
    # request time rather than at startup (allows the container to start even
    # when chatbot-server is not yet up or is unavailable during standalone testing).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy all /api/* to chatbot-server
    # proxy_buffering off is required for SSE streaming (chat responses)
    location /api/ {
        set $upstream http://chatbot-server:8000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # React SPA — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
