# docker-compose.yml
# Env vars are loaded from .env in the working directory.
# On Synology, run from /volume1/docker/myassistant/ where the .env lives.
name: myassistant
services:

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - /volume1/docker/myassistant/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - app-net

  http-server:
    image: ghcr.io/raviagg/myassistant/http-server:latest
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_TOKEN: ${AUTH_TOKEN}
      FILE_STORAGE_BASE_PATH: /data/files
      JAVA_OPTS: -Xms64m -Xmx256m
    volumes:
      - /volume1/docker/myassistant/uploads:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - app-net

  chatbot-server:
    image: ghcr.io/raviagg/myassistant/chatbot-server:latest
    restart: unless-stopped
    environment:
      CHATBOT_HTTP_URL: http://http-server:8080
      CHATBOT_AUTH_TOKEN: ${AUTH_TOKEN}
      BEDROCK_API_KEY: ${BEDROCK_API_KEY}
      CORS_ORIGIN: https://assistant.raviagg.com
    depends_on:
      http-server:
        condition: service_healthy
    networks:
      - app-net

  frontend:
    image: ghcr.io/raviagg/myassistant/frontend:latest
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - chatbot-server
    networks:
      - app-net

  scheduler:
    image: ghcr.io/raviagg/myassistant/scheduler:latest
    restart: unless-stopped
    environment:
      HTTP_SERVER_URL: http://http-server:8080
      AUTH_TOKEN: ${AUTH_TOKEN}
      NEWSAPIAI_KEY: ${NEWSAPIAI_KEY}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-UTC}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-duckduckgo}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      # News ranking tuning — defaults match newsapiai_source.py
      NEWS_ARTICLE_CAP: ${NEWS_ARTICLE_CAP:-200}
      NEWS_SOCIAL_CAP: ${NEWS_SOCIAL_CAP:-10000}
      NEWS_CATEGORY_WEIGHT_CAP: ${NEWS_CATEGORY_WEIGHT_CAP:-100}
      NEWS_P1_ARTICLE_WEIGHT: ${NEWS_P1_ARTICLE_WEIGHT:-0.50}
      NEWS_P1_SOCIAL_WEIGHT: ${NEWS_P1_SOCIAL_WEIGHT:-0.30}
      NEWS_P1_CATEGORY_WEIGHT: ${NEWS_P1_CATEGORY_WEIGHT:-0.20}
      NEWS_P2_ARTICLE_WEIGHT: ${NEWS_P2_ARTICLE_WEIGHT:-0.60}
      NEWS_P2_SOCIAL_WEIGHT: ${NEWS_P2_SOCIAL_WEIGHT:-0.40}
      NEWS_TOP_PER_CATEGORY: ${NEWS_TOP_PER_CATEGORY:-3}
      NEWS_MAX_EVENTS: ${NEWS_MAX_EVENTS:-20}
      NEWS_ARTICLES_PER_EVENT: ${NEWS_ARTICLES_PER_EVENT:-3}
      NEWS_LOG_PER_CATEGORY: ${NEWS_LOG_PER_CATEGORY:-15}
    depends_on:
      http-server:
        condition: service_healthy
    networks:
      - app-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - app-net

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - app-net

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Synology: replace with /var/packages/ContainerManager/var/docker/containers if needed
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    networks:
      - app-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    depends_on:
      - loki
    networks:
      - app-net

  github-runner:
    image: myoung34/github-runner:latest
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/raviagg/myassistant
      RUNNER_NAME: synology-runner
      RUNNER_LABELS: synology
      ACCESS_TOKEN: ${GITHUB_PAT}
      RUNNER_WORKDIR: /tmp/runner/work
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker/myassistant:/volume1/docker/myassistant
    mem_limit: 512m

networks:
  app-net:
    driver: bridge

volumes:
  loki-data:
  grafana-data:
