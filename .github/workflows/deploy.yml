# .github/workflows/deploy.yml
name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-scala:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build Scala fat JAR
        working-directory: backend/http_server
        run: sbt assembly

      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: http-server-jar
          path: backend/http_server/target/scala-3.4.2/myassistant-backend.jar
          retention-days: 1

  build-images:
    needs: build-scala
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: http-server
            context: backend/http_server
            file: ""
          - name: chatbot-server
            context: backend
            file: backend/chatbot_server/Dockerfile
          - name: frontend
            context: frontend
            file: ""
          - name: scheduler
            context: backend
            file: backend/scheduler/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Download fat JAR
        if: matrix.name == 'http-server'
        uses: actions/download-artifact@v4
        with:
          name: http-server-jar
          path: backend/http_server/target/scala-3.4.2/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file != '' && matrix.file || format('{0}/Dockerfile', matrix.context) }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}

  deploy:
    needs: build-images
    runs-on: [self-hosted, synology]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        run: |
          cp docker-compose.yml /volume1/docker/myassistant/docker-compose.yml
          cd /volume1/docker/myassistant
          docker-compose pull postgres http-server chatbot-server frontend scheduler cloudflared
          docker-compose up -d --remove-orphans postgres http-server chatbot-server frontend scheduler cloudflared
