# Local dev: tails .logs/*.log files written by start.sh.
# Each file gets a "service" label matching its filename.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: local_services
    static_configs:
      - labels:
          job: myassistant
          service: http_server
          __path__: /logs/http_server.log
      - labels:
          job: myassistant
          service: chatbot_server
          __path__: /logs/chatbot_server.log
      - labels:
          job: myassistant
          service: frontend
          __path__: /logs/frontend.log
      - labels:
          job: myassistant
          service: scheduler
          __path__: /logs/scheduler.log
